<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Khảo sát</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --red:#d71920; --navy:#1a3c6e; --gold:#ffc107; --green:#1e8e4e; --bg:#f4f6fb;
    --card:#fff; --line:#e5e9f2; --txt:#1c2434; --mut:#6b7280; }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:'Be Vietnam Pro',system-ui,sans-serif; background:var(--bg); color:var(--txt);
    min-height:100vh; padding:16px; -webkit-font-smoothing:antialiased}
  .wrap{max-width:860px; margin:0 auto}
  .head{background:linear-gradient(135deg,var(--navy),#2c4a8a); color:#fff; border-radius:16px;
    padding:20px; box-shadow:0 8px 24px rgba(26,60,110,.18)}
  .head h1{font-size:20px; font-weight:800} .head p{font-size:13px; opacity:.85; margin-top:5px}
  .card{background:var(--card); border-radius:14px; padding:18px; margin-top:14px;
    border:1px solid var(--line); box-shadow:0 2px 10px rgba(20,30,60,.06)}
  .card h2{font-size:15px; font-weight:700; color:var(--navy); margin-bottom:12px}
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px}
  .kpi{background:#f6f8fc; border:1px solid var(--line); border-radius:12px; padding:14px; text-align:center}
  .kpi .n{font-size:26px; font-weight:800; line-height:1} .kpi .l{font-size:11.5px; color:var(--mut); margin-top:6px}
  .kpi.red .n{color:var(--red)} .kpi.green .n{color:var(--green)} .kpi.navy .n{color:var(--navy)}
  .bar{height:10px; background:#e9edf5; border-radius:8px; overflow:hidden; margin-top:12px}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--green),#37b26c); border-radius:8px; transition:width .4s}
  .cas{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:4px}
  .cas label{font-size:11.5px; font-weight:600; color:var(--mut); display:block; margin-bottom:4px}
  .cas select,.filters input{padding:11px 13px; border:1.5px solid var(--line); border-radius:10px;
    font-family:inherit; font-size:14px; background:#fafbfd; outline:none; width:100%}
  .filters{margin-top:10px}
  .tbl-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%}
  table{width:100%; border-collapse:collapse; margin-top:8px; font-size:13px; white-space:nowrap}
  th,td{padding:9px 10px; text-align:left; border-bottom:1px solid var(--line); max-width:200px; overflow:hidden; text-overflow:ellipsis}
  th{background:#f6f8fc; color:var(--mut); font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px}
  th.nw,td.nw{white-space:nowrap}
  td.num{font-weight:700}
  .tag{display:inline-block; padding:3px 9px; border-radius:16px; font-size:11px; font-weight:700}
  .tag.ok{background:#e6f6ec; color:var(--green)} .tag.warn{background:#fdeeee; color:var(--red)}
  .login{max-width:380px; margin:60px auto}
  .login .btn{margin-top:12px}
  .btn{width:100%; background:var(--red); color:#fff; border:none; border-radius:12px; padding:14px;
    font-size:15px; font-weight:800; font-family:inherit; cursor:pointer; box-shadow:0 6px 18px rgba(215,25,32,.3)}
  .err{color:var(--red); font-size:12.5px; margin-top:8px; display:none}
  .empty{text-align:center; color:var(--mut); padding:24px 0; font-size:13.5px}
  .logout{float:right; font-size:12px; color:rgba(255,255,255,.85); text-decoration:none;
    background:rgba(255,255,255,.14); padding:6px 12px; border-radius:16px; cursor:pointer}
  .hdr-acts{float:right; display:flex; gap:6px}
  .hdr-btn{background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:16px;
    padding:5px 11px; font-size:11.5px; font-weight:600; font-family:inherit; cursor:pointer; white-space:nowrap}
  .hdr-btn:hover{background:rgba(255,255,255,.26)}
  .foot{text-align:center; color:var(--mut); font-size:11px; margin-top:16px}
  .grow{cursor:pointer; user-select:none}
  .grow .ar{display:inline-block; width:14px; font-size:11px; transition:.2s}
  .grow .ar.open{transform:rotate(90deg)}
  .gdv-row{display:flex; align-items:center; padding:8px 0; border-bottom:1px solid var(--line)}
  .gdv-row .name{font-weight:700; font-size:13px; min-width:140px}
  .gdv-row .bar-wrap{flex:1;height:8px;background:#e9edf5;border-radius:6px;overflow:hidden;margin:0 10px}
  .gdv-row .bar-wrap i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#37b26c);border-radius:6px}
  .gdv-row .stat{font-size:12px;white-space:nowrap;color:var(--mut);min-width:70px;text-align:right}
  .qlkv-sub{margin-left:20px;padding:4px 0;border-bottom:1px solid #f0f2f6}
  .gdv-table{width:100%;table-layout:fixed;border-collapse:collapse;margin-top:4px;font-size:13px}
  .gdv-table th{background:#f6f8fc;color:var(--mut);font-size:11px;font-weight:700;padding:8px 6px;text-align:right;border-bottom:2px solid var(--line);overflow:hidden;text-overflow:ellipsis}
  .gdv-table th.left{text-align:left}
  .gdv-table td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;overflow:hidden;text-overflow:ellipsis}
  .gdv-table td.left{text-align:left;font-weight:600}
  .gdv-table .bar-cell{min-width:0}
  .gdv-table .bar-cell i{display:block;height:7px;background:linear-gradient(90deg,var(--green),#37b26c);border-radius:5px}
  .gdv-table .qlkv-name{padding-left:24px;font-weight:500;font-size:12px}
  .col-gdv{width:22%}.col-num{width:7%}.col-bar{width:20%}.col-pct{width:6%}.col-warn{width:19%}.col-sum{width:19%}
  .gdv-sub{display:none}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
    z-index:999; padding:14px}
  .modal{background:#fff;border-radius:14px;padding:18px;max-width:420px;width:100%;box-shadow:0 16px 40px rgba(0,0,0,.2)}
  .modal h3{font-size:15px;font-weight:800;margin-bottom:12px;color:var(--navy)}
  .btn2{flex:1;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
  .btn2.ghost{background:#f0f2f7;color:var(--txt)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card login" id="loginBox">
    <h2>🔐 Đăng nhập Dashboard</h2>
    <p style="font-size:13px;color:var(--mut)" id="loginSub">Nhập mật khẩu để xem tiến độ</p>
    <div style="position:relative">
      <input id="pwd" type="password" placeholder="Mật khẩu" onkeydown="if(event.key==='Enter')login()" style="padding-right:44px">
      <span onclick="togglePwd()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:16px;user-select:none" id="pwdEye" title="Hiện/ẩn mật khẩu">👁️</span>
    </div>
    <button class="btn" onclick="login()">Đăng nhập</button>
    <div class="err" id="loginErr">Sai mật khẩu, thử lại</div>
  </div>

  <div id="dash" style="display:none">
    <div class="head">
      <div class="hdr-acts">
        <button class="hdr-btn" onclick="refreshData()" title="Đồng bộ dữ liệu mới nhất">🔄</button>
        <button class="hdr-btn" onclick="showImport()" title="Khai báo CH khảo sát">📥 Import</button>
        <button class="hdr-btn" onclick="logout()">Đăng xuất</button>
      </div>
      <h1>📊 Tiến độ — <span id="dTitle"></span></h1>
      <p>cập nhật: <span id="updated"></span></p>
    </div>
    <div class="card">
      <h2>Tổng quan</h2>
      <div class="kpis">
        <div class="kpi"><div class="n" id="kTotal">—</div><div class="l">Tổng CH</div></div>
        <div class="kpi green"><div class="n" id="kDone">—</div><div class="l">Đã khảo sát</div></div>
        <div class="kpi navy"><div class="n" id="kPct">—</div><div class="l">Tỷ lệ</div></div>
        <div class="kpi red"><div class="n" id="kAlert">—</div><div class="l">Cảnh báo</div></div>
      </div>
      <div class="bar"><i id="barFill" style="width:0%"></i></div>
    </div>
    <div class="card">
      <h2>📋 Theo GĐV</h2>
      <div id="gdvSection">Đang tải...</div>
    </div>
    <div class="card">
      <h2>🎯 Chọn địa bàn / CH</h2>
      <div class="cas">
        <div><label>Miền</label><select id="selMien"><option value="">— Miền —</option></select></div>
        <div><label>Vùng (GĐV)</label><select id="selVung"><option value="">— Vùng —</option></select></div>
        <div><label>QLKV</label><select id="selQlkv"><option value="">— QLKV —</option></select></div>
        <div><label>Cửa hàng</label><select id="selCh"><option value="">— CH —</option></select></div>
      </div>
      <div class="filters">
        <input id="fSearch" placeholder="Tìm mã SAP / tên CH..." oninput="renderTable()">
      </div>
    </div>
    <div class="err" id="tErr"></div>
    <div class="card">
      <h2>Danh sách khảo sát <span id="rowCount" style="color:var(--mut);font-weight:500"></span></h2>
      <div id="tableWrap"><div class="empty">Đang tải...</div></div>
    </div>
    <div class="foot">Dashboard · Survey Engine <span style="color:var(--mut)">v26.10.13</span></div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyF8_swNkrQnk_x40QeA-3hTLiLvOAonqa7wpGpt_R7HBuH7hllhDtzYqerfOZay2N_/exec';
const SID = new URLSearchParams(location.search).get('survey') || new URLSearchParams(location.search).get('s') || '';
let CFG = null, ROWS = [], STORES = [], TARGET = { saps: [], loaded: false };
let TOKEN = sessionStorage.getItem('sv_token_' + SID) || '';
const $ = id => document.getElementById(id);
const esc = s => (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const distinct = a => [...new Set(a)].sort((x,y)=>String(x).localeCompare(String(y),'vi'));

async function call(data){
  const r = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(data) });
  return r.json();
}

function togglePwd(){
  const p = $('pwd'), e = $('pwdEye');
  if(p.type === 'password'){ p.type = 'text'; e.textContent = '🙈'; }
  else { p.type = 'password'; e.textContent = '👁️'; }
}

async function login(){
  if(!SID){ $('loginSub').textContent = 'Thiếu tham số ?survey='; return; }
  const pwd = $('pwd').value.trim(); if(!pwd) return;
  $('loginErr').style.display = 'none';
  try{
    const res = await call({action:'getResults', id:SID, token:pwd});
    if(res.ok){ CFG = res.config; ROWS = (res.rows||[]).map(r=>{ r.sap=(r.sap||'').trim(); return r; }); TOKEN = pwd; sessionStorage.setItem('sv_token_'+SID, TOKEN); await enterando(); }
    else { $('loginErr').textContent = res.error || 'Sai mật khẩu, thử lại'; $('loginErr').style.display = 'block'; }
  }catch(e){ $('loginErr').textContent = 'Lỗi kết nối: '+e.message; $('loginErr').style.display = 'block'; }
}

async function enterando(){
  try{ const s = await call({action:'getStores', region: (CFG && CFG.region) || ''}); if(s.ok) STORES = (s.stores||[]).map(x=>{ x.sap=(x.sap||'').trim(); return x; }); }catch(e){}
  await loadTargets();
  $('loginBox').style.display = 'none'; $('dash').style.display = 'block';
  $('dTitle').textContent = CFG ? CFG.title : SID;
  $('updated').textContent = new Date().toLocaleString('vi-VN');
  buildMien(); render();
}

function buildMien(){
  const miens = distinct(STORES.map(s=>s.mien).filter(Boolean));
  $('selMien').innerHTML = '<option value="">— Miền —</option>' + miens.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');
  if(CFG.region && miens.includes(CFG.region)) $('selMien').value = CFG.region;
  buildVung();
}
function buildVung(){
  const m = $('selMien').value;
  const gs = distinct(STORES.filter(s=>!m||s.mien===m).map(s=>s.gdv).filter(Boolean));
  $('selVung').innerHTML = '<option value="">— Vùng (GĐV) —</option>' + gs.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
  buildQlkv();
}
function buildQlkv(){
  const m = $('selMien').value, v = $('selVung').value;
  const qs = distinct(STORES.filter(s=>(!m||s.mien===m)&&(!v||s.gdv===v)).map(s=>s.qlkv).filter(Boolean));
  $('selQlkv').innerHTML = '<option value="">— QLKV —</option>' + qs.map(q=>`<option value="${esc(q)}">${esc(q)}</option>`).join('');
  buildCh();
}
function buildCh(){
  const m=$('selMien').value, v=$('selVung').value, q=$('selQlkv').value;
  const chs = STORES.filter(s=>(!m||s.mien===m)&&(!v||s.gdv===v)&&(!q||s.qlkv===q));
  $('selCh').innerHTML = '<option value="">— Cửa hàng —</option>' + chs.map(s=>`<option value="${esc(s.sap)}">${esc(s.sap)} · ${esc(s.ten)}</option>`).join('');
}

async function loadTargets(){
  try{ const r = await call({action:'getTargets',id:SID});
    if(r.ok){ TARGET.saps = r.saps || []; TARGET.loaded = true; } }catch(e){}
  renderTargetList();
}
function pasteTargets(){
  const tp = $('tPaste'); if(!tp) return;
  const raw = tp.value; if(!raw.trim()) return;
  const saps = raw.split(/[,;\n\r]+/).map(s=>s.trim()).filter(Boolean);
  let added = 0;
  saps.forEach(sap => { if(!TARGET.saps.includes(sap)){ TARGET.saps.push(sap); added++; } });
  $('tPaste').value = ''; if(added) renderTargetList();
}
function renderTargetList(){
  const box = $('tList');
  if(!box) return;
  if(!TARGET.saps.length){
    box.innerHTML = '<div style="font-size:13px;color:var(--mut)">Chưa có CH nào trong danh sách mục tiêu</div>';
    return;
  }
  let html = '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">';
  TARGET.saps.forEach((sap,i) => {
    const s = STORES.find(x=>x.sap===sap) || {};
    html += `<span style="display:inline-flex;align-items:center;gap:6px;background:#eef3fb;padding:4px 10px;border-radius:16px;font-size:12.5px;font-weight:500">
      ${esc(sap)} · ${esc(s.ten||'?')} · ${esc(s.gdv||'')}
      <b style="cursor:pointer;color:var(--red);margin-left:2px" onclick="TARGET.saps.splice(${i},1);renderTargetList()">✕</b></span>`;
  });
  html += '</div>';
  box.innerHTML = html;
}
async function saveTargets(){
  $('tErr').style.display='none';
  try{
    const r = await call({action:'setTargets',id:SID, saps:TARGET.saps});
    if(r.ok){ $('tErr').style.display='block'; $('tErr').style.color='var(--green)'; $('tErr').textContent = '✅ Đã lưu ' + r.count + ' CH mục tiêu'; render(); }
    else { $('tErr').style.display='block'; $('tErr').textContent=r.error||'Lỗi'; }
  }catch(e){ $('tErr').style.display='block'; $('tErr').textContent='Lỗi kết nối'; }
}

function scopeSaps(){
  if(TARGET.saps.length) return new Set(TARGET.saps);
  const m=$('selMien').value, v=$('selVung').value, q=$('selQlkv').value, c=$('selCh').value;
  let s = STORES.filter(x=>(!m||x.mien===m)&&(!v||x.gdv===v)&&(!q||x.qlkv===q)&&(!c||x.sap===c));
  return new Set(s.map(x=>x.sap));
}

function isWarn(r){ return (CFG && CFG.sum && CFG.sum.warn != null) ? (r.total >= CFG.sum.warn) : false; }

function scopedRows(){
  const set = scopeSaps();
  return ROWS.filter(r => set.has(r.sap));
}

function render(){
  const scoped = scopedRows();
  const total = scopeSaps().size;
  const done = new Set(ROWS.map(r=>r.sap)).size;
  const alert = scoped.filter(isWarn).length;
  const hasTargets = TARGET.loaded && TARGET.saps.length > 0;

  $('kTotal').textContent = total || '—';
  $('kTotal').parentElement.querySelector('.l').textContent = hasTargets ? 'CH mục tiêu' : 'Tổng CH';
  $('kDone').textContent = done;
  const pct = total ? Math.round(done/total*100) : 0;
  $('kPct').textContent = pct + '%';
  $('kAlert').textContent = alert;
  $('barFill').style.width = Math.min(100,pct) + '%';
  buildGdvSection();
  renderTable();
}

function buildGdvSection(){
  const set = scopeSaps();
  const rows = scopedRows();
  const doneSet = new Set(rows.map(r=>r.sap));
  const sInScope = STORES.filter(s=>set.has(s.sap));
  const gdvs = [...new Set(sInScope.map(s=>s.gdv).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'vi'));
  if(!gdvs.length){ $('gdvSection').innerHTML = '<div style="font-size:13px;color:var(--mut)">Chưa có dữ liệu</div>'; return; }

  const sumLabel = (CFG.sum||{}).label||'Tổng';
  const warnLabel = (CFG.sum||{}).warnLabel||'CH có vấn đề';
  let html = `<table class="gdv-table"><thead><tr>
    <th class="left col-gdv">GĐV</th><th class="col-num">CH KS</th><th class="col-num">Đã làm</th><th class="bar-cell col-bar">Tỷ lệ</th><th class="col-pct">%</th>
    <th class="col-warn">${esc(warnLabel)}</th><th class="col-sum">${esc(sumLabel)}</th></tr></thead><tbody>`;

  gdvs.forEach(gdv => {
    const cls = 'sub-' + gdv.replace(/[^a-zA-Z0-9]/g,'_');
    const sGdv = sInScope.filter(s=>s.gdv===gdv);
    const t = sGdv.length;
    const d = sGdv.filter(s=>doneSet.has(s.sap)).length;
    const pct = t ? Math.round(d/t*100) : 0;
    const rGdv = rows.filter(r=>sGdv.some(s=>s.sap===r.sap));
    const warn = rGdv.filter(isWarn).length;
    const sumTot = rGdv.reduce((a,r)=>a+(r.total||0),0);
    html += `<tr class="grow" onclick="toggleGdv(this,'${cls}')" style="cursor:pointer">
      <td class="left col-gdv"><span class="ar">▶</span> ${esc(gdv)}</td><td class="col-num">${t}</td><td class="col-num">${d}</td>
      <td class="bar-cell col-bar"><i style="width:${pct}%"></i></td><td class="col-pct">${pct}%</td>
      <td class="col-warn" style="color:${warn?'var(--red)':'inherit'}">${warn||'—'}</td><td class="col-sum">${sumTot||'—'}</td></tr>`;
    // QLKV rows — same table, same column widths
    const qlkvs = [...new Set(sGdv.map(s=>s.qlkv).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),'vi'));
    qlkvs.forEach(q => {
      const sQ = sGdv.filter(s=>s.qlkv===q);
      const qt = sQ.length;
      const qd = sQ.filter(s=>doneSet.has(s.sap)).length;
      const qpct = qt?Math.round(qd/qt*100):0;
      const rQ = rows.filter(r=>sQ.some(s=>s.sap===r.sap));
      const qwarn = rQ.filter(isWarn).length;
      const qsum = rQ.reduce((a,r)=>a+(r.total||0),0);
      html += `<tr class="gdv-sub ${cls}" style="display:none">
        <td class="left col-gdv qlkv-name">${esc(q)}</td><td class="col-num">${qt}</td><td class="col-num">${qd}</td>
        <td class="bar-cell col-bar"><i style="width:${qpct}%"></i></td><td class="col-pct">${qpct}%</td>
        <td class="col-warn" style="color:${qwarn?'var(--red)':'inherit'}">${qwarn||'—'}</td><td class="col-sum">${qsum||'—'}</td></tr>`;
    });
  });
  html += '</tbody></table>';
  $('gdvSection').innerHTML = html;
}

let gdvOpen = {};
function toggleGdv(row, cls){
  const rows = document.querySelectorAll('.' + cls);
  const ar = row.querySelector('.ar');
  if(gdvOpen[cls]){
    rows.forEach(r => r.style.display = 'none');
    if(ar) ar.classList.remove('open');
  } else {
    rows.forEach(r => r.style.display = 'table-row');
    if(ar) ar.classList.add('open');
  }
  gdvOpen[cls] = !gdvOpen[cls];
}

function renderTable(){
  const scoped = scopedRows();
  const q = $('fSearch').value.trim().toLowerCase();
  const list = scoped.filter(r => !q || (r.ten||'').toLowerCase().includes(q) || (r.sap||'').toLowerCase().includes(q) || (r.qlkv||'').toLowerCase().includes(q));
  $('rowCount').textContent = '· ' + list.length + '/' + ROWS.length + ' phiếu';

  if(!list.length){ $('tableWrap').innerHTML = '<div class="empty">Chưa có dữ liệu</div>'; return; }

  let html = '<table><thead><tr><th>Thời gian</th><th>Mã SAP</th><th>Tên CH</th><th>Tỉnh</th><th>QLKV</th><th>GĐV</th>';
  (CFG.fields||[]).forEach(f => html += `<th>${esc(f.label)}</th>`);
  if(CFG.sum) html += `<th>${esc(CFG.sum.label)}</th><th>Trạng thái</th>`;
  html += '</tr></thead><tbody>';

  for(const r of list){
    const w = isWarn(r);
    html += `<tr><td style="white-space:nowrap">${esc(r.ts)}</td><td>${esc(r.sap)}</td><td>${esc(r.ten)}</td><td>${esc(r.tinh)}</td><td>${esc(r.qlkv)}</td><td>${esc(r.gdv)}</td>`;
    (CFG.fields||[]).forEach(f => {
      const v = r[f.key];
      if(f.type === 'image'){
        const links = String(v||'').split('\n').filter(Boolean);
        if(!links.length){ html += '<td></td>'; }
        else {
          html += '<td>' + links.map((l,i)=>{
            const m = (l||'').match(/\/d\/([^/]+)/);
            const thumb = m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w200' : '';
            return thumb
              ? `<a href="${esc(l)}" target="_blank"><img src="${thumb}" style="width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line)"></a>`
              : `<a href="${esc(l)}" target="_blank">Ảnh ${i+1}</a>`;
          }).join(' ') + '</td>';
        }
      } else if(f.type === 'url'){
        html += `<td>${v ? `<a href="${esc(v)}" target="_blank" style="color:var(--navy)">🔗 Mở link</a>` : ''}</td>`;
      } else if(f.type === 'rating'){
        const n = Math.max(1, Math.min(5, +v || 0));
        html += `<td>${v ? ('★'.repeat(n) + '☆'.repeat(5-n)) : ''}</td>`;
      } else {
        html += `<td>${esc(v)}</td>`;
      }
    });
    if(CFG.sum) html += `<td class="num" style="color:${w?'var(--red)':'inherit'}">${r.total}</td><td>${w?'<span class="tag warn">⚠️ '+esc(r.warn||'')+'</span>':'<span class="tag ok">OK</span>'}</td>`;
    html += '</tr>';
  }
  html += '</tbody></table>';
  $('tableWrap').innerHTML = '<div class="tbl-scroll">' + html + '</div>';
}

async function refreshData(){
  try{ const res = await call({action:'getResults',id:SID,token:TOKEN});
    if(res.ok){ ROWS = res.rows || []; CFG = res.config; $('updated').textContent = new Date().toLocaleString('vi-VN'); render(); }
    else showErr('Lỗi đồng bộ'); }catch(e){ showErr('Không kết nối được'); }
}
function showErr(msg){ $('tErr').textContent = msg; $('tErr').style.display = 'block'; $('tErr').style.color = 'var(--red)'; }
function showImport(){ const ov = $('importOverlay'); if(!ov) return; ov.style.display = 'flex'; $('importSaps').value = ''; }
async function importAllSites(){
  const saps = [...scopeSaps()];
  TARGET.saps = saps;
  const ov = $('importOverlay'); if(ov) ov.style.display = 'none';
  try{
    const r = await call({action:'setTargets',id:SID,saps:TARGET.saps});
    if(r.ok){ renderTargetList(); render(); $('tErr').style.display='block'; $('tErr').style.color='var(--green)'; $('tErr').textContent='✅ Đã import '+r.count+' CH'; }
    else showErr(r.error||'Lỗi');
  }catch(e){ showErr('Lỗi kết nối'); }
}
async function importPasted(){
  const imp = $('importSaps'); if(!imp) return;
  const raw = imp.value; if(!raw.trim()) return;
  const saps = raw.split(/[,;\n\r]+/).map(s=>s.trim()).filter(Boolean);
  TARGET.saps = saps;
  const ov = $('importOverlay'); if(ov) ov.style.display = 'none';
  try{
    const r = await call({action:'setTargets',id:SID,saps:TARGET.saps});
    if(r.ok){ renderTargetList(); render(); $('tErr').style.display='block'; $('tErr').style.color='var(--green)'; $('tErr').textContent='✅ Đã import '+r.count+' CH'; }
    else showErr(r.error||'Lỗi');
  }catch(e){ showErr('Lỗi kết nối'); }
}

function logout(){ sessionStorage.removeItem('sv_token_'+SID); TOKEN=''; ROWS=[]; STORES=[]; CFG=null; TARGET={saps:[],loaded:false};
  $('dash').style.display='none'; $('loginBox').style.display='block'; $('pwd').value=''; }

$('selMien').addEventListener('change', ()=>{ buildVung(); render(); });
$('selVung').addEventListener('change', ()=>{ buildQlkv(); render(); });
$('selQlkv').addEventListener('change', ()=>{ buildCh(); render(); });
$('selCh').addEventListener('change', render);

(async function init(){
  if(TOKEN){
    try{ const res = await call({action:'getResults', id:SID, token:TOKEN});
      if(res.ok){ CFG = res.config; ROWS = res.rows||[]; await enterando(); return; } }catch(e){}
    sessionStorage.removeItem('sv_token_'+SID); TOKEN='';
  }
  if(SID){ try{ const s = await call({action:'getSurvey', id:SID}); if(s.ok) $('loginSub').textContent = s.config.title; }catch(e){} }
})();
</script>

      <button class="btn" style="margin-bottom:10px;background:var(--navy)" onclick="importAllSites()">📋 Import tất cả CH (mặc định)</button>
      <div style="border-top:1px solid var(--line);padding-top:10px;margin-bottom:6px">
